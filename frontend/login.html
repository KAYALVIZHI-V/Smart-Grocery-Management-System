<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Smart Grocery</h1>

        <h2>Login</h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email">

        <input
            type="password"
            id="loginPassword"
            placeholder="Password">

        <button onclick="login()">
            Login
        </button>

        <p>
            Don't have an account?
            <a href="signup.html">Signup</a>
        </p>

        <p id="loginMessage"></p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
